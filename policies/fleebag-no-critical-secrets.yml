---
apiVersion: v1
kind: policy
spec:
  name: "Fleebag: No critical secrets detected (scan current)"
  description: >
    Verifies that bagel secret scanning has run within the last 7 days and found
    no critical-severity findings on this device. Checks every real local user
    account (uid >= 500, home under /Users/, excluding /Users/Shared).

    PASS: all local users have a fresh results.json with no critical findings.
    FAIL: any user is missing a results file, has a stale scan (> 7 days), or
    has one or more critical-severity findings.
  resolution: >
    1. Confirm the fleebag LaunchAgent is loaded:
       launchctl list | grep zip.recyclebin.fleebag
    2. Run a manual scan as the affected user:
       /usr/local/libexec/fleebag-scan
    3. Review findings at ~/Library/Logs/fleebag/results.json.
    4. Remediate any critical findings and re-run to confirm resolution.
  query: |
    SELECT 'pass' AS result
    WHERE
        (SELECT COUNT(*) FROM users
         WHERE uid >= 500
           AND directory LIKE '/Users/%'
           AND directory != '/Users/Shared') > 0
        AND (SELECT COUNT(*) FROM users
             WHERE uid >= 500
               AND directory LIKE '/Users/%'
               AND directory != '/Users/Shared')
          = (SELECT COUNT(*) FROM file
             WHERE path = '/Users/*/Library/Logs/fleebag/results.json'
               AND (strftime('%s', 'now') - mtime) < 604800)
        AND 0 = (SELECT COUNT(*) FROM parse_json
                 WHERE path   = '/Users/*/Library/Logs/fleebag/results.json'
                   AND key    = 'severity'
                   AND parent LIKE 'findings/%'
                   AND value  = 'critical');
  critical: true
  platform: darwin
