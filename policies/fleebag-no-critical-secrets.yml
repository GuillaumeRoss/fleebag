---
apiVersion: v1
kind: policy
spec:
  name: "Fleebag: No critical secrets detected (scan current)"
  description: >
    Verifies that bagel secret scanning has run within the last 7 days and found
    no critical-severity findings on this device. Checks every real local user
    account (uid >= 500, home under /Users/, excluding /Users/Shared).

    PASS: all local users have a fresh results.json with no critical findings.
    FAIL: any user is missing a results file, has a stale scan (> 7 days), or
    has one or more critical-severity findings.
  resolution: >
    1. Confirm the fleebag LaunchAgent is loaded:
       launchctl list | grep zip.recyclebin.fleebag
    2. Run a manual scan as the affected user:
       /usr/local/libexec/fleebag-scan
    3. Review findings at ~/Library/Logs/fleebag/results.json.
    4. Remediate any critical findings and re-run to confirm resolution.
  query: |
    SELECT
        'pass'      AS result,
        u.username  AS username
    FROM users u
    WHERE u.uid  >= 500
      AND u.directory LIKE '/Users/%'
      AND u.directory != '/Users/Shared'
      AND EXISTS (
          SELECT 1
          FROM file f
          WHERE f.path = (u.directory || '/Library/Logs/fleebag/results.json')
            AND (strftime('%s', 'now') - f.mtime) < 604800
      )
      AND NOT EXISTS (
          SELECT 1
          FROM parse_json pj
          WHERE pj.path   = (u.directory || '/Library/Logs/fleebag/results.json')
            AND pj.key    = 'severity'
            AND pj.parent LIKE 'findings/%'
            AND pj.value  = 'critical'
      )
      AND NOT EXISTS (
          SELECT 1
          FROM users u2
          WHERE u2.uid  >= 500
            AND u2.directory LIKE '/Users/%'
            AND u2.directory != '/Users/Shared'
            AND (
              NOT EXISTS (
                  SELECT 1 FROM file f2
                  WHERE f2.path = (u2.directory || '/Library/Logs/fleebag/results.json')
                    AND (strftime('%s', 'now') - f2.mtime) < 604800
              )
              OR
              EXISTS (
                  SELECT 1 FROM parse_json pj2
                  WHERE pj2.path   = (u2.directory || '/Library/Logs/fleebag/results.json')
                    AND pj2.key    = 'severity'
                    AND pj2.parent LIKE 'findings/%'
                    AND pj2.value  = 'critical'
              )
            )
      )
    LIMIT 1;
  critical: true
  platform: darwin
