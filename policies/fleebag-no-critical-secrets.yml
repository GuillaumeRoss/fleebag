---
apiVersion: v1
kind: policy
spec:
  name: "Fleebag: No critical secrets detected (scan current)"
  description: >
    Verifies that bagel secret scanning has run within the last 1 week and found
    no critical-severity findings on this device.

    PASS: at least one results.json under /Users/ is fresh (< 1 week old) and
    no results.json contains a critical-severity finding.
    FAIL: no fresh results.json exists (agent not running or stale), or any
    results.json contains a critical-severity finding.
  resolution: >
    1. Confirm the fleebag LaunchAgent is loaded:
       launchctl list | grep zip.recyclebin.fleebag
    2. Run a manual scan as the affected user:
       /usr/local/libexec/fleebag-scan
    3. Review findings at ~/Library/Logs/fleebag/results.json.
    4. Remediate any critical findings and re-run to confirm resolution.
  query: |
    SELECT 1
    WHERE
        EXISTS (
            SELECT 1 FROM file
            WHERE path = '/Users/*/Library/Logs/fleebag/results.json'
              AND (strftime('%s', 'now') - mtime) < 604800
        )
        AND NOT EXISTS (
            SELECT 1 FROM parse_json
            WHERE path   = '/Users/*/Library/Logs/fleebag/results.json'
              AND key    = 'severity'
              AND parent LIKE 'findings/%'
              AND value  = 'critical'
        );
  critical: true
  platform: darwin
